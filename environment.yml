name: nfl-predictions
channels:
  - conda-forge
dependencies:
  # Core scientific stack
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - scipy
  - matplotlib
  # Modeling (pinned to the versions the saved models were trained with)
  - scikit-learn=1.4.2
  - xgboost=2.0.3
  # Notebook execution (RFE / grid-search experiments)
  - jupyter
  - nbconvert
  - ipykernel
  - pip
  - pip:
      - fastparquet==2024.5.0
      - nfl-data-py==0.3.1
